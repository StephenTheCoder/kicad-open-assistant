name: test-and-package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.5'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-test.lock
      - run: python -m pytest -q
      - run: python scripts/audit_release.py
  package:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.5'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: --target vendor -r requirements-client.lock
      - run: python scripts/build_release.py
      - run: python scripts/build_release.py --output dist/reproducibility-check.zip
      - shell: python
        run: |
          from pathlib import Path
          import hashlib
          first = Path('dist/kicad-open-assistant-0.1.0-windows-kicad10.zip')
          second = Path('dist/reproducibility-check.zip')
          assert hashlib.sha256(first.read_bytes()).digest() == hashlib.sha256(second.read_bytes()).digest()
      - run: python scripts/audit_release.py --archive dist/kicad-open-assistant-0.1.0-windows-kicad10.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-pcm-package
          if-no-files-found: error
          path: |
            dist/kicad-open-assistant-0.1.0-windows-kicad10.zip
            dist/kicad-open-assistant-0.1.0-windows-kicad10.zip.sha256
  container:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: KOA_SERVER_SECRET_FILE=/dev/null docker compose -f deploy/compose.yaml config --quiet
      - run: docker build -f deploy/Dockerfile -t koa-service:test .
      - run: >-
          docker run --detach --name koa-service-smoke --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m --mount type=volume,source=koa-ci-ledger,target=/data
          --cap-drop ALL --security-opt no-new-privileges --memory 768m --pids-limit 64 koa-service:test
      - run: docker exec -i koa-service-smoke python < scripts/container_smoke.py
      - run: >-
          docker run --detach --name koa-managed-smoke --user 0:0 --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m --mount type=volume,source=koa-ci-managed,target=/data
          --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add DAC_OVERRIDE --cap-add SETUID --cap-add SETGID
          --security-opt no-new-privileges --memory 1g --pids-limit 64
          -e KOA_LEDGER=/data/koa/ledger.sqlite3 koa-service:test
          python -m kicad_open_assistant.service.host
      - run: docker exec --user 10001:10001 -i koa-managed-smoke python < scripts/container_smoke.py
      - run: docker exec --user 10001:10001 -i koa-managed-smoke python - prepare-restart < scripts/host_smoke.py
      - run: docker restart koa-managed-smoke
      - run: docker exec --user 10001:10001 -i koa-managed-smoke python < scripts/container_smoke.py
      - run: docker exec --user 10001:10001 -i koa-managed-smoke python - verify-restart < scripts/host_smoke.py
      - if: failure()
        run: docker logs koa-managed-smoke
      - if: failure()
        run: docker inspect --format '{{json .State}}' koa-managed-smoke
      - if: always()
        run: docker stop koa-service-smoke koa-managed-smoke

  ingress-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: >-
          docker run --rm --network none --entrypoint caddy
          -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
          validate --adapter caddyfile --config /etc/caddy/Caddyfile
