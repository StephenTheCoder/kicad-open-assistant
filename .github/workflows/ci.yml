name: test-and-package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.5'
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-test.lock
      - run: python -m pytest -q
      - run: python scripts/audit_release.py
  package:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.5'
      - run: python -m pip install --require-hashes --only-binary=:all: --target vendor -r requirements-client.lock
      - run: python scripts/build_release.py
      - run: python scripts/build_release.py --output dist/reproducibility-check.zip
      - shell: python
        run: |
          from pathlib import Path
          import hashlib
          first = Path('dist/kicad-open-assistant-0.1.0-windows-kicad10.zip')
          second = Path('dist/reproducibility-check.zip')
          assert hashlib.sha256(first.read_bytes()).digest() == hashlib.sha256(second.read_bytes()).digest()
      - run: python scripts/audit_release.py --archive dist/kicad-open-assistant-0.1.0-windows-kicad10.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-pcm-package
          if-no-files-found: error
          path: |
            dist/kicad-open-assistant-0.1.0-windows-kicad10.zip
            dist/kicad-open-assistant-0.1.0-windows-kicad10.zip.sha256
  container:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker build -f deploy/Dockerfile -t koa-service:test .
      - run: docker run --rm -e KOA_LEDGER=/tmp/test-ledger.sqlite3 koa-service:test python -m kicad_open_assistant.service.admin init
